name: Release PWA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify release revision
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD origin/main
          test -s "docs/releases/$GITHUB_REF_NAME.md"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package the tested PWA
        run: |
          mkdir release
          (cd dist && zip -qr "../release/supacon-$GITHUB_REF_NAME.zip" .)
          (cd release && sha256sum "supacon-$GITHUB_REF_NAME.zip" > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: pwa-release
          path: release/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pwa-release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Supacon $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            "release/supacon-$GITHUB_REF_NAME.zip" release/SHA256SUMS
